name: verify

# Two things run here, and they check different kinds of wrong.
#
# `scrub` is the hygiene gate: generic patterns for credentials, infrastructure identity
# and internal paths. It runs first because a leak that reaches this repository is already
# published — git history outlives a revert.
#
# `vectors` recomputes every pinned Permit2 digest along two implementations that share
# nothing, and then plants deliberate defects to prove the check can go red. A cross-check
# nobody has seen fail is not evidence.
#
# How many defects are planted is printed by each script and written down NOWHERE else,
# including in the step names below. A count in a step name is a second source that cannot
# be executed: on 2026-09-07 this file promised six and seven while the scripts planted
# seven and eight. Both jobs were green throughout — a drifted count fails nothing, it just
# quietly describes a set that no longer exists.
#
# Actions are pinned by commit SHA, not by tag. A tag is a moving pointer, and a workflow
# that trusts one is trusting whoever can move it.

# Every branch, not just the trunk. A leak reaches the public the moment it is pushed
# anywhere in a public repository, so gating only the default branch gates the wrong thing.
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: hygiene gate
        run: ./scripts/scrub-check.sh

  attestation:
    # The verifier that reads PCR0 out of the SIGNED attestation document, and the
    # falsifications that prove each of its named checks can go red. No network: the
    # fixture is a production extract, and the mutations are applied to it in place.
    # `chain_internal` is deliberately not asserted here — Nitro leaf certificates are
    # short-lived, so a stored document's chain expires on its own schedule and a test
    # that asserted it would go red on a calendar rather than on a defect. The harness
    # says so itself, in the file, next to the assertion it does not make.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: every named attestation check must be able to go red
        run: python3 demo/test-attest-verify.py

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: keccak golden vectors
        working-directory: vectors
        run: python3 keccak_min.py

      - name: Permit2 — path A, our own encoder, standard library only
        working-directory: vectors
        run: python3 verify_ours.py

      - name: Permit2 — falsification, every planted defect must be caught
        working-directory: vectors
        run: python3 falsify.py

      - name: position NFTs — path A, incl. the pinned on-chain domain separators
        working-directory: vectors
        run: python3 verify_nft_ours.py

      - name: position NFTs — falsification, every planted mutation must be caught
        working-directory: vectors
        run: python3 falsify_nft.py

      - name: path B — Uniswap's own SDK, plus viem
        working-directory: vectors
        run: |
          npm ci
          node verify_sdk.mjs
          node verify_nft_sdk.mjs

      # The emitted file must be byte-identical to the committed one. Without this, a
      # change to the encoder could quietly rewrite the expectations it is checked against
      # and every job above would still be green.
      - name: pinned vectors are not silently regenerated
        working-directory: vectors
        run: |
          python3 verify_ours.py --emit
          python3 verify_nft_ours.py --emit
          git diff --exit-code -- permit2-vectors.json nft-permit-vectors.json
